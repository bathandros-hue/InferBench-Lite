[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench-lite"
version = "0.1.0"
description = "Honest latency and throughput benchmarking for non-streaming LLM APIs"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
inferbench = "inferbench.cli:main"

[tool.setuptools.packages.find]
include = ["inferbench*"]
